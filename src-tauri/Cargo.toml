[package]
name = "nukamiso"
version = "2.3.0"
description = "Nukamiso — zero-dependency, local-first desktop subtitle editor (single-file core)"
edition = "2021"

[lib]
name = "nukamiso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
