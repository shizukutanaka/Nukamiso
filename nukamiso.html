<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP: by default this page talks to no one. The ONLY exceptions are the
     two pinned origins used when (and only when) the user explicitly downloads
     the optional on-device transcription engine/model (Phase H):
     cdn.jsdelivr.net (engine code) and huggingface.co + *.hf.co (model files).
     Audio and subtitle data are never transmitted; inference runs locally. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob: https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net https://huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Nukamiso — Subtitle Editor</title>
<style>
:root{
  --bg:#f5f1ea; --panel:#fffdf8; --ink:#2b2620; --sub:#7a7264;
  --accent:#b3541e; --accent2:#3f6212; --line:#e3dccf; --warn:#b45309; --err:#b91c1c;
  --hl:#fde68a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.02em}
header h1 small{color:var(--sub);font-size:11px;font-weight:normal}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn:disabled{opacity:.45;cursor:default}
select.btn,input[type=text],input[type=number],textarea{font:inherit}
main{display:grid;grid-template-columns:minmax(340px,1.2fr) minmax(300px,1fr);gap:12px;padding:12px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.panel h2 .tag{float:right;font-size:11px;color:var(--sub);font-weight:normal}
video{width:100%;background:#000;border-radius:8px;max-height:300px}
#waveCanvas{width:100%;height:110px;background:#1c1917;border-radius:8px;cursor:pointer;display:block}
table.cues{width:100%;border-collapse:collapse}
table.cues th{font-size:11px;color:var(--sub);text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
table.cues td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.cues tr.current td{background:var(--hl)}
table.cues input[type=text].tc{width:86px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table.cues textarea{width:100%;min-height:34px;resize:vertical;font-size:13px}
.rowbtns{white-space:nowrap}
.rowbtns .btn{padding:2px 6px;font-size:11px}
#issues{font-size:12px;max-height:160px;overflow:auto}
#issues .error{color:var(--err)} #issues .warning{color:var(--warn)} #issues .info{color:var(--sub)}
#asrStatus{font-size:12px;color:var(--sub)}
#asrInterim{font-size:13px;color:var(--accent);min-height:1.4em}
.dictrow{display:flex;gap:6px;margin-bottom:6px}
.dictrow input{flex:1}
footer{padding:10px 14px;color:var(--sub);font-size:12px;text-align:center}
.hidden{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
label.chk{font-size:12px;color:var(--sub);display:inline-flex;gap:4px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>Nukamiso <small id="verLabel"></small></h1>
  <button class="btn" id="btnOpenSub" data-i18n="openSub">字幕を開く</button>
  <input type="file" id="fileSub" accept=".srt,.vtt,.ass,.txt" class="hidden">
  <button class="btn" id="btnOpenMedia" data-i18n="openMedia">動画/音声を開く</button>
  <input type="file" id="fileMedia" accept="video/*,audio/*" class="hidden">
  <label><span data-i18n="saveAs">保存形式</span>
    <select class="btn" id="selFormat">
      <option value="srt">SRT</option><option value="vtt">VTT</option>
      <option value="ass">ASS</option><option value="txt">TXT</option>
    </select>
  </label>
  <button class="btn primary" id="btnSave" data-i18n="save">保存</button>
  <button class="btn" id="btnValidate" data-i18n="validate">検証</button>
  <button class="btn" id="btnLang">EN</button>
</header>
<main>
  <section>
    <div class="panel">
      <h2><span data-i18n="cues">字幕キュー</span><span class="tag">Phase A/B</span></h2>
      <div class="toolbar">
        <button class="btn" id="btnAddCue" data-i18n="addCue">＋追加</button>
        <button class="btn" id="btnShift" data-i18n="shiftAll">全体シフト</button>
        <input type="text" id="shiftSec" size="6" placeholder="+0.5s">
        <label class="chk"><input type="checkbox" id="chkDictAuto" checked><span data-i18n="dictAuto">辞書を自動適用</span></label>
        <button class="btn" id="btnDictApply" data-i18n="dictApply">辞書を全キューに適用</button>
      </div>
      <div style="max-height:520px;overflow:auto">
      <table class="cues"><thead><tr>
        <th data-i18n="colStart">開始</th><th data-i18n="colEnd">終了</th><th data-i18n="colText">テキスト</th><th></th>
      </tr></thead><tbody id="cueBody"></tbody></table>
      </div>
      <div id="issues"></div>
    </div>
    <div class="panel">
      <h2><span data-i18n="dictTitle">ユーザー辞書</span><span class="tag">Phase D</span></h2>
      <div id="dictList"></div>
      <div class="dictrow">
        <input type="text" id="dictFrom" data-i18n-ph="dictFrom" placeholder="誤認識（例: ぬかみそ）">
        <input type="text" id="dictTo" data-i18n-ph="dictTo" placeholder="正表記（例: 糠味噌）">
        <button class="btn" id="btnDictAdd" data-i18n="add">追加</button>
      </div>
    </div>
  </section>
  <section>
    <div class="panel">
      <h2><span data-i18n="media">メディア</span><span class="tag">Phase A/E</span></h2>
      <video id="media" controls playsinline></video>
      <canvas id="waveCanvas" width="900" height="110"></canvas>
      <div class="toolbar" style="margin-top:8px">
        <button class="btn" id="btnAsr">🎙 <span data-i18n="asrStart">音声入力開始</span></button>
        <select class="btn" id="selAsrLang">
          <option value="ja-JP">日本語</option><option value="en-US">English</option>
        </select>
        <span id="asrStatus"></span>
      </div>
      <div id="asrInterim"></div>
      <div id="asrUnsupported" class="hidden" style="color:var(--warn);font-size:12px" data-i18n="asrUnsupported">このブラウザは音声認識に対応していません。手入力で全機能が使えます。</div>
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">
        <div style="font-weight:bold;margin-bottom:4px">📄 <span data-i18n="txTitle">ファイルから文字起こし（端末内）</span></div>
        <div id="txInfo" style="font-size:12px;color:var(--sub)"></div>
        <div class="toolbar" style="margin-top:6px">
          <select class="btn" id="selTxModel"></select>
          <button class="btn" id="btnTxLoad" data-i18n="txLoad">エンジンをダウンロード</button>
          <button class="btn primary" id="btnTxStart" disabled data-i18n="txStart">文字起こし開始</button>
          <button class="btn" id="btnTxCancel" disabled data-i18n="txCancel">中断</button>
        </div>
        <progress id="txProgress" value="0" max="100" style="width:100%" class="hidden"></progress>
        <div id="txStatus" style="font-size:12px;color:var(--sub)"></div>
      </div>
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">
        <div style="font-weight:bold;margin-bottom:4px">🎬 <span data-i18n="burnTitle">字幕を焼き込んで書き出し（端末内）</span></div>
        <div id="burnInfo" style="font-size:12px;color:var(--sub)"></div>
        <div class="toolbar" style="margin-top:6px">
          <button class="btn primary" id="btnBurnStart" disabled data-i18n="burnStart">焼き込み書き出し</button>
          <button class="btn" id="btnBurnCancel" disabled data-i18n="burnCancel">中断</button>
        </div>
        <progress id="burnProgress" value="0" max="100" style="width:100%" class="hidden"></progress>
        <div id="burnStatus" style="font-size:12px;color:var(--sub)"></div>
      </div>
    </div>
    <div class="panel">
      <h2><span data-i18n="track2">翻訳トラック（第2言語）</span><span class="tag">Phase C</span></h2>
      <div class="toolbar">
        <button class="btn" id="btnCopyTiming" data-i18n="copyTiming">タイミングを複写</button>
        <button class="btn" id="btnSave2" data-i18n="saveTrack2">第2トラックを保存</button>
      </div>
      <div style="max-height:300px;overflow:auto">
      <table class="cues"><thead><tr>
        <th data-i18n="colStart">開始</th><th data-i18n="colEnd">終了</th><th data-i18n="colText">テキスト</th><th></th>
      </tr></thead><tbody id="cueBody2"></tbody></table>
      </div>
    </div>
  </section>
</main>
<footer>Nukamiso — Single-file / Zero-dependency / Local-first / Zero-telemetry. <span data-i18n="footerNote">データはこの端末の外に出ません。</span></footer>

<script>
'use strict';
/* ==== NK CORE BEGIN ==== */
/* Nukamiso core logic: pure functions, no DOM. Extracted by tests/. */
var NK = (typeof window !== 'undefined' && window.NK) ? window.NK : {};
if (typeof window !== 'undefined') window.NK = NK;

NK.version = '2.2.0';
/* These flags describe the shipped file itself: it bundles no dependencies,
   sends no telemetry, and by default makes no network requests at all.
   Phase H is the single opt-in exception: the transcription engine/model are
   fetched ONLY when the user explicitly clicks the download button, and even
   then audio/subtitle data never leaves the device (inference is local). */
NK.config = { zeroDep: true, singleFile: true, localFirst: true, zeroTelemetry: true };
NK.features = { phaseA: true, phaseB: true, phaseC: true, phaseD: true, phaseE: true, phaseF: true, phaseG: true, phaseH: true, phaseI: true };

/* ---------- time utilities (all times are milliseconds) ---------- */
NK.time = {
  pad: function (n, l) { var s = String(n); while (s.length < (l || 2)) s = '0' + s; return s; },
  /* "HH:MM:SS,mmm" | "HH:MM:SS.mmm" | "MM:SS.mmm" | "H:MM:SS.cc" -> ms, or NaN */
  parse: function (str) {
    if (typeof str !== 'string') return NaN;
    var m = str.trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})(?:[.,](\d{1,3}))?$/);
    if (!m) return NaN;
    var h = m[1] ? parseInt(m[1], 10) : 0;
    var min = parseInt(m[2], 10), sec = parseInt(m[3], 10);
    var frac = m[4] || '';
    var ms = 0;
    if (frac.length === 1) ms = parseInt(frac, 10) * 100;
    else if (frac.length === 2) ms = parseInt(frac, 10) * 10;
    else if (frac.length >= 3) ms = parseInt(frac.slice(0, 3), 10);
    return ((h * 60 + min) * 60 + sec) * 1000 + ms;
  },
  formatSRT: function (ms) { return NK.time._fmt(ms, ','); },
  formatVTT: function (ms) { return NK.time._fmt(ms, '.'); },
  _fmt: function (ms, sep) {
    if (!(ms >= 0)) ms = 0;
    ms = Math.round(ms);
    var h = Math.floor(ms / 3600000), min = Math.floor(ms / 60000) % 60,
        sec = Math.floor(ms / 1000) % 60, m = ms % 1000;
    return NK.time.pad(h) + ':' + NK.time.pad(min) + ':' + NK.time.pad(sec) + sep + NK.time.pad(m, 3);
  },
  /* ASS uses H:MM:SS.cc (centiseconds) */
  formatASS: function (ms) {
    if (!(ms >= 0)) ms = 0;
    var cs = Math.round(ms / 10);
    var h = Math.floor(cs / 360000), min = Math.floor(cs / 6000) % 60,
        sec = Math.floor(cs / 100) % 60, c = cs % 100;
    return h + ':' + NK.time.pad(min) + ':' + NK.time.pad(sec) + '.' + NK.time.pad(c);
  },
  parseASS: function (str) {
    if (typeof str !== 'string') return NaN;
    var m = str.trim().match(/^(\d+):(\d{1,2}):(\d{1,2})\.(\d{1,2})$/);
    if (!m) return NaN;
    var cs = parseInt(m[4].length === 1 ? m[4] + '0' : m[4], 10);
    return ((parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) * 60 + parseInt(m[3], 10)) * 1000 + cs * 10;
  }
};

/* ---------- format detection ---------- */
NK.detectFormat = function (text) {
  if (typeof text !== 'string' || !text) return 'unknown';
  if (/^\s*WEBVTT/.test(text)) return 'vtt';
  if (/\[Script Info\]/i.test(text) || /\[Events\]/i.test(text)) return 'ass';
  if (/\d{1,2}:\d{2}:\d{2}[.,]\d{1,3}\s*-->/.test(text)) return 'srt';
  return 'unknown';
};

/* ---------- parsers: text -> [{start,end,text}] (ms). Never throw. ---------- */
NK.parse = {
  srt: function (text) {
    var cues = [];
    try {
      var blocks = String(text).replace(/\r\n?/g, '\n').split(/\n\s*\n/);
      for (var i = 0; i < blocks.length; i++) {
        var lines = blocks[i].split('\n').filter(function (l) { return l.trim() !== ''; });
        if (!lines.length) continue;
        var ti = -1, j;
        for (j = 0; j < lines.length; j++) { if (lines[j].indexOf('-->') >= 0) { ti = j; break; } }
        if (ti < 0) continue;
        var parts = lines[ti].split('-->');
        var start = NK.time.parse(parts[0]);
        var end = NK.time.parse((parts[1] || '').trim().split(/\s+/)[0]);
        if (isNaN(start) || isNaN(end)) continue;
        var body = lines.slice(ti + 1).join('\n').trim();
        cues.push({ start: start, end: end, text: body });
      }
    } catch (e) { /* fuzz-safety: return what we have */ }
    return cues;
  },
  vtt: function (text) {
    var cues = [];
    try {
      var clean = String(text).replace(/\r\n?/g, '\n');
      var blocks = clean.split(/\n\s*\n/);
      for (var i = 0; i < blocks.length; i++) {
        var block = blocks[i];
        if (/^\s*(WEBVTT|NOTE|STYLE|REGION)/.test(block)) continue;
        var lines = block.split('\n').filter(function (l) { return l.trim() !== ''; });
        if (!lines.length) continue;
        var ti = -1, j;
        for (j = 0; j < lines.length; j++) { if (lines[j].indexOf('-->') >= 0) { ti = j; break; } }
        if (ti < 0) continue;
        var parts = lines[ti].split('-->');
        var start = NK.time.parse(parts[0]);
        var end = NK.time.parse((parts[1] || '').trim().split(/\s+/)[0]);
        if (isNaN(start) || isNaN(end)) continue;
        var body = lines.slice(ti + 1).join('\n')
          .replace(/<[^>]*>/g, '').trim();
        cues.push({ start: start, end: end, text: body });
      }
    } catch (e) { }
    return cues;
  },
  ass: function (text) {
    var cues = [];
    try {
      var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
      var inEvents = false, fmt = null;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (/^\s*\[Events\]/i.test(line)) { inEvents = true; continue; }
        if (/^\s*\[/.test(line)) { inEvents = false; continue; }
        if (!inEvents) continue;
        if (/^\s*Format:/i.test(line)) {
          fmt = line.replace(/^\s*Format:/i, '').split(',').map(function (s) { return s.trim().toLowerCase(); });
          continue;
        }
        if (!/^\s*Dialogue:/i.test(line) || !fmt) continue;
        var rest = line.replace(/^\s*Dialogue:/i, '').replace(/^\s/, '');
        /* Text is the last Format field and may itself contain commas. */
        var nFields = fmt.length;
        var fields = [], cur = '', count = 0, k;
        for (k = 0; k < rest.length; k++) {
          var ch = rest[k];
          if (ch === ',' && count < nFields - 1) { fields.push(cur); cur = ''; count++; }
          else cur += ch;
        }
        fields.push(cur);
        var si = fmt.indexOf('start'), ei = fmt.indexOf('end'), ti2 = fmt.indexOf('text');
        if (si < 0 || ei < 0 || ti2 < 0) continue;
        var start = NK.time.parseASS(fields[si]);
        var end = NK.time.parseASS(fields[ei]);
        if (isNaN(start) || isNaN(end)) continue;
        var body = (fields[ti2] || '')
          .replace(/\{[^}]*\}/g, '')
          .replace(/\\N/g, '\n').replace(/\\h/g, ' ')
          .trim();
        cues.push({ start: start, end: end, text: body });
      }
    } catch (e) { }
    return cues;
  },
  /* Plain text: one cue per non-empty line, sequential 2s slots. */
  txt: function (text) {
    var cues = [];
    try {
      var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
      var idx = 0;
      for (var i = 0; i < lines.length; i++) {
        var t = lines[i].trim();
        if (!t) continue;
        cues.push({ start: idx * 2000, end: idx * 2000 + 1800, text: t });
        idx++;
      }
    } catch (e) { }
    return cues;
  },
  auto: function (text) {
    var f = NK.detectFormat(text);
    if (f === 'srt') return NK.parse.srt(text);
    if (f === 'vtt') return NK.parse.vtt(text);
    if (f === 'ass') return NK.parse.ass(text);
    return [];
  }
};

/* ---------- serializers ---------- */
function nkSorted(cues) {
  return (cues || []).slice().sort(function (a, b) { return (a.start - b.start) || (a.end - b.end); });
}
NK.serialize = {
  srt: function (cues) {
    var cs = nkSorted(cues), out = [];
    for (var i = 0; i < cs.length; i++) {
      out.push(String(i + 1));
      out.push(NK.time.formatSRT(cs[i].start) + ' --> ' + NK.time.formatSRT(cs[i].end));
      out.push(String(cs[i].text || ''));
      out.push('');
    }
    return out.join('\n');
  },
  vtt: function (cues) {
    var cs = nkSorted(cues), out = ['WEBVTT', ''];
    for (var i = 0; i < cs.length; i++) {
      out.push(NK.time.formatVTT(cs[i].start) + ' --> ' + NK.time.formatVTT(cs[i].end));
      out.push(String(cs[i].text || ''));
      out.push('');
    }
    return out.join('\n');
  },
  ass: function (cues) {
    var cs = nkSorted(cues);
    var head = [
      '[Script Info]',
      'Title: Nukamiso subtitles',
      'ScriptType: v4.00+',
      '',
      '[V4+ Styles]',
      'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
      'Style: Default,Arial,48,&H00FFFFFF,&H000000FF,&H00000000,&H64000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,10,1',
      '',
      '[Events]',
      'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text'
    ];
    var out = head.slice();
    for (var i = 0; i < cs.length; i++) {
      var body = String(cs[i].text || '').replace(/\r\n?/g, '\n').replace(/\n/g, '\\N');
      out.push('Dialogue: 0,' + NK.time.formatASS(cs[i].start) + ',' + NK.time.formatASS(cs[i].end) +
        ',Default,,0,0,0,,' + body);
    }
    return out.join('\n') + '\n';
  },
  txt: function (cues) {
    var cs = nkSorted(cues), out = [];
    for (var i = 0; i < cs.length; i++) out.push(String(cs[i].text || ''));
    return out.join('\n') + (out.length ? '\n' : '');
  }
};

/* ---------- validation ---------- */
/* nkValidate(text) -> { format, cues, issues: [{level, message, cue?}] }.
   issues is ALWAYS an array, including for format 'unknown'
   (regression guard for the Phase E bug where unknown dropped issues). */
NK.nkValidate = function (text) {
  var format = NK.detectFormat(text);
  var issues = [];
  if (format === 'unknown') {
    issues.push({ level: 'error', message: 'Could not detect subtitle format (expected SRT, VTT or ASS).' });
    if (typeof text !== 'string' || !text || !text.trim()) {
      issues.push({ level: 'error', message: 'Input is empty.' });
    } else {
      issues.push({ level: 'warning', message: 'No cue timestamps (--> lines) were found.' });
    }
    return { format: format, cues: [], issues: issues };
  }
  var cues = NK.parse.auto(text);
  if (!cues.length) {
    issues.push({ level: 'error', message: 'Format looks like ' + format.toUpperCase() + ' but no cues could be parsed.' });
  }
  return { format: format, cues: cues, issues: issues.concat(NK.validateCues(cues)) };
};

NK.validateCues = function (cues) {
  var issues = [];
  var cs = cues || [];
  for (var i = 0; i < cs.length; i++) {
    var c = cs[i];
    if (!(c.end > c.start)) {
      issues.push({ level: 'error', cue: i, message: 'Cue ' + (i + 1) + ': end time is not after start time.' });
    }
    if (i > 0 && c.start < cs[i - 1].start) {
      issues.push({ level: 'warning', cue: i, message: 'Cue ' + (i + 1) + ': start time goes backwards.' });
    }
    if (i > 0 && c.start < cs[i - 1].end) {
      issues.push({ level: 'warning', cue: i, message: 'Cue ' + (i + 1) + ': overlaps the previous cue.' });
    }
    if (!c.text || !String(c.text).trim()) {
      issues.push({ level: 'warning', cue: i, message: 'Cue ' + (i + 1) + ': text is empty.' });
    }
    var lines = String(c.text || '').split('\n');
    for (var j = 0; j < lines.length; j++) {
      if (lines[j].length > 42) {
        issues.push({ level: 'info', cue: i, message: 'Cue ' + (i + 1) + ': line ' + (j + 1) + ' is long (' + lines[j].length + ' chars > 42).' });
      }
    }
    if (c.end - c.start > 7000) {
      issues.push({ level: 'info', cue: i, message: 'Cue ' + (i + 1) + ': duration is long (' + ((c.end - c.start) / 1000).toFixed(1) + 's > 7s).' });
    }
  }
  return issues;
};

/* ---------- user dictionary (Phase D) ---------- */
NK.dict = {
  entries: [], /* [{from, to}] */
  apply: function (text, entries) {
    var list = (entries || NK.dict.entries || []).slice()
      .filter(function (e) { return e && e.from; })
      .sort(function (a, b) { return b.from.length - a.from.length; });
    var src = String(text == null ? '' : text);
    if (!list.length || !src) return src;
    /* Single left-to-right pass, longest match wins. Replacement output is
       NOT rescanned, so rules never cascade into each other's results
       (e.g. ぬかみそ→糠味噌 must not then trigger a 糠→… rule). */
    var out = '', i = 0;
    while (i < src.length) {
      var hit = null;
      for (var j = 0; j < list.length; j++) {
        if (src.substr(i, list[j].from.length) === list[j].from) { hit = list[j]; break; }
      }
      if (hit) { out += hit.to; i += hit.from.length; }
      else { out += src[i]; i++; }
    }
    return out;
  },
  applyToCues: function (cues, entries) {
    return (cues || []).map(function (c) {
      return { start: c.start, end: c.end, text: NK.dict.apply(c.text, entries) };
    });
  }
};

/* ---------- cue operations ---------- */
NK.cues = {
  shift: function (cues, deltaMs) {
    return (cues || []).map(function (c) {
      var s = Math.max(0, c.start + deltaMs);
      var e = Math.max(s, c.end + deltaMs);
      return { start: s, end: e, text: c.text };
    });
  },
  split: function (cues, index) {
    var out = (cues || []).slice();
    var c = out[index];
    if (!c) return out;
    var mid = Math.floor((c.start + c.end) / 2);
    var text = String(c.text || '');
    var nl = text.indexOf('\n');
    var t1 = text, t2 = '';
    if (nl >= 0) { t1 = text.slice(0, nl); t2 = text.slice(nl + 1); }
    out.splice(index, 1,
      { start: c.start, end: mid, text: t1 },
      { start: mid, end: c.end, text: t2 });
    return out;
  },
  merge: function (cues, index) {
    var out = (cues || []).slice();
    if (index < 0 || index >= out.length - 1) return out;
    var a = out[index], b = out[index + 1];
    out.splice(index, 2, {
      start: Math.min(a.start, b.start), end: Math.max(a.end, b.end),
      text: (String(a.text || '') + '\n' + String(b.text || '')).replace(/^\n|\n$/g, '')
    });
    return out;
  }
};

/* ---------- on-device file transcription (Phase H) ----------
   Pure planning/conversion logic lives here so Node tests can pin it down.
   The browser-only parts (engine download, audio decode, worker) are in the
   UI section. The engine is Transformers.js (pinned) running OpenAI Whisper
   ONNX models (quantized, q8) fully on-device via WASM. Nothing is fetched
   until the user explicitly asks, and audio is never transmitted. */
NK.transcribe = {
  /* Pinned engine build (Transformers.js 3.7.2, jsDelivr bundled ESM). */
  ENGINE_URL: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2/+esm',
  ENGINE_SOURCE: 'cdn.jsdelivr.net',
  /* Approximate download size of the engine itself (JS bundle + the
     onnxruntime WASM binary), shown to the user before downloading. */
  ENGINE_SIZE_MB: 23,
  MODEL_SOURCE: 'huggingface.co',
  /* Whisper models (ONNX q8) hosted on Hugging Face Hub. License: Apache-2.0
     (per the model repositories' metadata). Sizes are the measured totals of
     the files the engine actually downloads (encoder + merged decoder +
     tokenizer/config), rounded up. */
  MODELS: [
    { id: 'Xenova/whisper-tiny', sizeMB: 42, labelJa: 'Whisper Tiny（高速・軽量）', labelEn: 'Whisper Tiny (fast, small)' },
    { id: 'Xenova/whisper-base', sizeMB: 80, labelJa: 'Whisper Base（高精度・日本語向き）', labelEn: 'Whisper Base (accurate, better for Japanese)' }
  ],
  SAMPLE_RATE: 16000,
  CHUNK_MS: 30000, /* Whisper's context window is 30 seconds. */
  /* Split [0, durationMs] into consecutive windows of at most chunkMs.
     Returns [] for non-positive/invalid durations. Never throws. */
  planChunks: function (durationMs, chunkMs) {
    var out = [];
    var total = Math.floor(Number(durationMs));
    var step = Math.floor(Number(chunkMs)) || NK.transcribe.CHUNK_MS;
    if (!(total > 0) || !(step > 0)) return out;
    for (var s = 0; s < total; s += step) {
      out.push({ startMs: s, endMs: Math.min(total, s + step) });
    }
    return out;
  },
  /* Convert Whisper segment chunks ([{timestamp:[startSec,endSec], text}])
     for one audio window into subtitle cues (ms), offset by the window's
     start. endSec may be null (open-ended final segment): the window end is
     used when known. Empty segments are dropped, times are clamped into the
     window, and every cue is at least 500ms long. Never throws. */
  chunksToCues: function (chunks, offsetMs, windowEndMs) {
    var cues = [];
    if (!Array.isArray(chunks)) return cues;
    var off = Math.max(0, Math.floor(Number(offsetMs) || 0));
    var wEnd = (typeof windowEndMs === 'number' && windowEndMs > off) ? Math.floor(windowEndMs) : null;
    for (var i = 0; i < chunks.length; i++) {
      var ch = chunks[i];
      if (!ch || !Array.isArray(ch.timestamp)) continue;
      var text = String(ch.text == null ? '' : ch.text).trim();
      if (!text) continue;
      var sSec = Number(ch.timestamp[0]);
      if (!isFinite(sSec)) continue;
      var start = off + Math.round(sSec * 1000);
      var eRaw = ch.timestamp[1];
      var end;
      if (eRaw !== null && eRaw !== undefined && isFinite(Number(eRaw))) end = off + Math.round(Number(eRaw) * 1000);
      else if (wEnd !== null) end = wEnd;
      else end = start + 2000;
      if (start < off) start = off;
      if (wEnd !== null && end > wEnd) end = wEnd;
      if (end <= start) end = start + 500;
      cues.push({ start: start, end: end, text: text });
    }
    cues.sort(function (a, b) { return (a.start - b.start) || (a.end - b.end); });
    return cues;
  },
  /* Map the UI language select values to Whisper language names.
     Returns undefined for anything else (Whisper then auto-detects). */
  languageName: function (uiLang) {
    if (uiLang === 'ja-JP') return 'japanese';
    if (uiLang === 'en-US') return 'english';
    return undefined;
  }
};

/* ---------- burned-in subtitle export (Phase I) ----------
   Pure planning logic for rendering the current cues INTO a video file
   (canvas + MediaRecorder in the UI section). Everything runs on-device:
   no network, no new dependencies, no CSP change.
   The drawing style deliberately mirrors the product's one existing
   subtitle rendering spec, the ASS export Default style (see
   NK.serialize.ass): Arial, Fontsize 48, white primary colour, black
   outline of width 2, Alignment 2 (bottom-centre), MarginV 10. ASS files
   written by Nukamiso declare no PlayRes, for which the reference frame
   height is 288, so sizes are expressed as ratios of the frame height
   and reproduce the ASS look at any resolution (48/288, 10/288, 2/48). */
NK.burn = {
  STYLE: {
    fontFamily: 'Arial, sans-serif',
    color: '#ffffff',        /* ASS PrimaryColour &H00FFFFFF */
    outlineColor: '#000000', /* ASS OutlineColour &H00000000 */
    fontRatio: 48 / 288,     /* ASS Fontsize 48 at reference height 288 */
    marginVRatio: 10 / 288,  /* ASS MarginV 10 at reference height 288 */
    outlineRatio: 2 / 48,    /* ASS Outline 2 relative to Fontsize 48 */
    lineHeight: 1.25,
    maxWidthRatio: 0.92      /* keep wrapped text off the frame edges */
  },
  /* Re-encode container preferences, best first. MP4 where the browser's
     MediaRecorder offers it (recent Safari / Chrome), WebM elsewhere. */
  CANDIDATE_MIMES: [
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ],
  /* The cue on screen at tMs, using the same rule as the editor's
     playback highlight: the first cue with start <= t < end. */
  cueAt: function (cues, tMs) {
    var cs = cues || [];
    for (var i = 0; i < cs.length; i++) {
      if (tMs >= cs[i].start && tMs < cs[i].end) return cs[i];
    }
    return null;
  },
  /* First candidate the injected predicate accepts, else null.
     The UI passes MediaRecorder.isTypeSupported; tests pass a fake. */
  pickMimeType: function (isSupported) {
    if (typeof isSupported !== 'function') return null;
    for (var i = 0; i < NK.burn.CANDIDATE_MIMES.length; i++) {
      try { if (isSupported(NK.burn.CANDIDATE_MIMES[i])) return NK.burn.CANDIDATE_MIMES[i]; }
      catch (e) { /* a throwing predicate just rules that candidate out */ }
    }
    return null;
  },
  outputName: function (mimeType) {
    return String(mimeType || '').indexOf('mp4') >= 0 ? 'subtitled.mp4' : 'subtitled.webm';
  },
  /* MediaRecorder's default bitrate is low enough to blur subtitle
     edges, so scale with pixel count, clamped to a sane range. */
  videoBitrate: function (width, height) {
    var px = Math.max(0, (Number(width) || 0) * (Number(height) || 0));
    var bps = Math.round(px * 5);
    if (bps < 2500000) bps = 2500000;
    if (bps > 16000000) bps = 16000000;
    return bps;
  },
  /* Greedy per-character wrap (works for Japanese text without spaces).
     measure(str, fontPx) -> width in px is injected: the UI measures with
     a real canvas context, tests with a fake. Explicit newlines in the
     cue text are preserved as line breaks. Never throws. */
  wrapLines: function (text, maxWidthPx, fontPx, measure) {
    var out = [];
    var raw = String(text == null ? '' : text).split('\n');
    for (var i = 0; i < raw.length; i++) {
      var line = raw[i];
      if (!line || !(maxWidthPx > 0) || typeof measure !== 'function' ||
          measure(line, fontPx) <= maxWidthPx) { out.push(line); continue; }
      var cur = '';
      for (var j = 0; j < line.length; j++) {
        var cand = cur + line[j];
        if (cur && measure(cand, fontPx) > maxWidthPx) { out.push(cur); cur = line[j]; }
        else cur = cand;
      }
      if (cur) out.push(cur);
    }
    return out;
  },
  /* Geometry for one cue on a width x height frame:
     { fontPx, lineHeightPx, outlinePx (visible thickness), marginV,
       lines: [{ text, x (centre), y (baseline) }] }.
     Lines stack upward from the bottom margin, ASS Alignment 2 style. */
  layout: function (text, width, height, measure) {
    var S = NK.burn.STYLE;
    var w = Math.max(0, Number(width) || 0), h = Math.max(0, Number(height) || 0);
    var fontPx = Math.max(8, Math.round(h * S.fontRatio));
    var lineHeightPx = Math.round(fontPx * S.lineHeight);
    var outlinePx = Math.max(1, Math.round(fontPx * S.outlineRatio));
    var marginV = Math.round(h * S.marginVRatio);
    var lines = NK.burn.wrapLines(text, Math.floor(w * S.maxWidthRatio), fontPx, measure);
    var lastBaseline = h - marginV - Math.round(fontPx * 0.22);
    var items = [];
    for (var i = 0; i < lines.length; i++) {
      items.push({
        text: lines[i], x: Math.round(w / 2),
        y: lastBaseline - (lines.length - 1 - i) * lineHeightPx
      });
    }
    return { fontPx: fontPx, lineHeightPx: lineHeightPx, outlinePx: outlinePx, marginV: marginV, lines: items };
  }
};
/* ==== NK CORE END ==== */
</script>

    txUpdateButtons();

  function txEnsureWorker() {

    w.onmessage = function (e) {

  /* ---------- burned-in subtitle export (Phase I) ----------

    $('burnProgress').classList.remove('hidden');
    $('burnProgress').value = 0;
    burnSetStatus(tf('burnRunning', { pct: 0 }));
    burnUpdateButtons();

    var v = document.createElement('video');
    burn.video = v;
    v.playsInline = true;
    v.preload = 'auto';
    v.src = state.mediaURL;
    var chunks = [], audioOk = false, hasAudioSignal = false;
    var metaReady = new Promise(function (resolve, reject) {
      v.addEventListener('loadedmetadata', function () { resolve(); }, { once: true });
      v.addEventListener('error', function () {
        reject(new Error((v.error && v.error.message) || 'media load error'));
      }, { once: true });
    });
    metaReady.then(function () {
      if (burn.cancel) { burnAbortCancelled(); return; }
      var w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) { burnFail(t('burnAudioOnly')); return; }
      if (!isFinite(v.duration) || !(v.duration > 0)) {
        burnFail('duration unknown'); return;
      }
      hasAudioSignal = !!((v.audioTracks && v.audioTracks.length) ||
        v.mozHasAudio || (v.webkitAudioDecodedByteCount || 0) > 0);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      var stream = canvas.captureStream(30);
      /* Audio: route the offscreen element through Web Audio into the
         recording (not to the speakers, so the export stays silent in
         the room). Fall back to the element's own captureStream audio. */
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          burn.actx = new AC();
          var srcNode = burn.actx.createMediaElementSource(v);
          var dest = burn.actx.createMediaStreamDestination();
          srcNode.connect(dest);
          if (burn.actx.resume) burn.actx.resume();
          var at = dest.stream.getAudioTracks()[0];
          if (at) { stream.addTrack(at); audioOk = true; }
        }
      } catch (e) { audioOk = false; }
      if (!audioOk) {
        try {
          var cs = v.captureStream ? v.captureStream() : null;
          var at2 = cs && cs.getAudioTracks()[0];
          if (at2) { stream.addTrack(at2); audioOk = true; }
        } catch (e) { }
      }
      var rec = new MediaRecorder(stream, {
        mimeType: burn.mime,
        videoBitsPerSecond: NK.burn.videoBitrate(w, h)
      });
      burn.rec = rec;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onerror = function (e) { burnFail(String((e.error && e.error.message) || 'MediaRecorder error')); };
      rec.onstop = function () {
        if (burn.settled) return;
        burn.settled = true;
        burnCleanup();
        burnFinishUi();
        if (burn.cancel) { burnSetStatus(t('burnCancelled')); return; }
        var name = NK.burn.outputName(burn.mime);
        downloadBlob(name, new Blob(chunks, { type: burn.mime.split(';')[0] }));
        burnSetStatus(tf('burnDone', { name: name }) +
          ((hasAudioSignal && !audioOk) ? ' ' + t('burnNoAudio') : ''));
      };
      var lastDrawnT = -1;
      function drawFrame() {
        if (burn.settled || burn.cancel) return;
        var tNow = v.currentTime;
        if (tNow !== lastDrawnT) {
          lastDrawnT = tNow;
          try { ctx.drawImage(v, 0, 0, w, h); } catch (e) { }
          burnDrawCue(ctx, w, h, tNow * 1000);
          var pct = v.duration ? Math.min(100, Math.round(tNow / v.duration * 100)) : 0;
          if (pct !== burn.lastPct) {
            burn.lastPct = pct;
            $('burnProgress').value = pct;
            burnSetStatus(tf('burnRunning', { pct: pct }));
          }
        }
        if (v.ended && rec.state !== 'inactive') { try { rec.stop(); } catch (e) { } }
      }
      /* Drive drawing from BOTH requestAnimationFrame (smooth while the
         tab is visible) and a plain timer. rAF alone can be starved —
         background tab, busy renderer — and would then silently skip
         whole cue windows while the recorder keeps the wall-clock
         timeline; the timer guarantees the drawing follows the video's
         clock. drawFrame is idempotent (it draws only when the video
         time actually changed), so the two drivers never double-draw. */
      (function rafLoop() {
        drawFrame();
        if (!burn.settled && !burn.cancel) burn.rafId = requestAnimationFrame(rafLoop);
      })();
      burn.timerId = setInterval(drawFrame, 40);
      v.addEventListener('ended', function () {
        drawFrame(); /* land the final frame/cue before stopping */
        if (rec.state !== 'inactive') { try { rec.stop(); } catch (e) { } }
      });
      rec.start(250);
      drawFrame();
      var p = v.play();
      if (p && p.catch) p.catch(function (err) {
        burnFail(String((err && err.message) || err));
      });
    }).catch(function (err) {
      burnFail(String((err && err.message) || err));
    });
  });

  /* ---------- init ---------- */
  $('verLabel').textContent = 'v' + NK.version;
  restore();
  applyI18n();
  /* Transcribe panel first: renderAll() below touches NK.wave, which is only
     defined by the following script block, and must not block this init. */
  renderTxModels();
  txUpdateButtons();
  if (!state.mediaFile) txSetStatus(t('txNeedMedia'));
  renderBurnInfo();
  burn.mime = burnMimeType();
  burnUpdateButtons();
  if (!burn.mime) burnSetStatus(t('burnUnsupported'));
  else if (!state.mediaFile) burnSetStatus(t('burnNeedMedia'));
  renderAll();
})();
</script>

<script>
'use strict';
/* ==== Waveform view (Phase E) — isolated module, Web Audio + canvas only.
        Exposed as NK.wave and aliased to NK.waveSurfer so the same API
        works in the browser and inside the Tauri shell. ==== */
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;
  var wave = {
    peaks: null, duration: 0, cues: [], playhead: 0, _ctx: null,
    loadFile: function (file) {
      var self = this;
      file.arrayBuffer().then(function (buf) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!self._ctx) self._ctx = new AC();
        return self._ctx.decodeAudioData(buf.slice(0));
      }).then(function (audioBuf) {
        if (!audioBuf) return;
        self.duration = audioBuf.duration;
        var ch = audioBuf.getChannelData(0);
        var buckets = 1200, peaks = new Float32Array(buckets);
        var per = Math.max(1, Math.floor(ch.length / buckets));
        for (var i = 0; i < buckets; i++) {
          var max = 0, off = i * per;
          for (var j = 0; j < per; j += 16) {
            var v = Math.abs(ch[off + j] || 0);
            if (v > max) max = v;
          }
          peaks[i] = max;
        }
        self.peaks = peaks;
        self.draw();
      }).catch(function () { /* audio decode is best-effort */ });
    },
    setCues: function (cues) { this.cues = cues || []; this.draw(); },
    setPlayhead: function (sec) { this.playhead = sec || 0; this.draw(); },
    draw: function () {
      var canvas = document.getElementById('waveCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#1c1917'; ctx.fillRect(0, 0, W, H);
      var dur = this.duration || 0;
      /* cue regions */
      if (dur > 0) {
        ctx.fillStyle = 'rgba(179,84,30,0.35)';
        for (var i = 0; i < this.cues.length; i++) {
          var x1 = (this.cues[i].start / 1000 / dur) * W;
          var x2 = (this.cues[i].end / 1000 / dur) * W;
          ctx.fillRect(x1, 0, Math.max(1, x2 - x1), H);
        }
      }
      /* peaks */
      if (this.peaks) {
        ctx.fillStyle = '#a8a29e';
        var mid = H / 2, n = this.peaks.length;
        for (var x = 0; x < W; x++) {
          var p = this.peaks[Math.floor(x / W * n)] || 0;
          var h = Math.max(1, p * (H - 8));
          ctx.fillRect(x, mid - h / 2, 1, h);
        }
      } else {
        ctx.fillStyle = '#78716c';
        ctx.font = '12px sans-serif';
        ctx.fillText('waveform: open a media file', 10, H / 2);
      }
      /* playhead */
      if (dur > 0) {
        ctx.fillStyle = '#facc15';
        var px = (this.playhead / dur) * W;
        ctx.fillRect(px, 0, 2, H);
      }
    }
  };
  NK.wave = wave;
  NK.waveSurfer = wave; /* same isolated API surface as the design's NK.waveSurfer */
  var canvas = document.getElementById('waveCanvas');
  if (canvas) {
    canvas.addEventListener('click', function (ev) {
      var media = document.getElementById('media');
      if (!media || !wave.duration) return;
      var rect = canvas.getBoundingClientRect();
      var ratio = (ev.clientX - rect.left) / rect.width;
      try { media.currentTime = ratio * wave.duration; } catch (e) { }
    });
  }
})();
</script>
</body>
